# Непрекъсната интеграция (CI): при всеки push и pull request
# GitHub компилира решението и пуска всички тестове.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Изтегляне на кода
        uses: actions/checkout@v4

      - name: Инсталиране на .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Възстановяване на пакетите
        run: dotnet restore PetShelter.slnx

      - name: Компилиране
        run: dotnet build PetShelter.slnx --no-restore --configuration Release

      - name: Тестове с измерване на покритието
        run: dotnet test PetShelter.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Запазване на отчета за покритието
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage
